<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    
    <!-- Outer Citadel Hexagon -->
    <path d="M50 5 L90 27.5 L90 72.5 L50 95 L10 72.5 L10 27.5 Z" 
          stroke="#0f172a" 
          stroke-width="8" 
          stroke-linejoin="round"
          stroke-linecap="round" 
          fill="none"/>
    
    <!-- Inner Ops Core Group: Contains all growth bars and trend line -->
    <g transform="translate(50, 50) scale(0.84) translate(-50, -50)"
       fill="none"
       stroke-linecap="round" 
       stroke-linejoin="round">
        
        <!-- Growth Bars: Using Emerald 600 (#059669) for better visibility on light bg -->
        <path d="M28 75 L28 60" stroke="#059669" stroke-width="8" />
        <path d="M44 75 L44 45" stroke="#059669" stroke-width="8" />
        <path d="M60 75 L60 50" stroke="#059669" stroke-width="8" />
        <path d="M76 75 L76 30" stroke="#059669" stroke-width="8" />
        
        <!-- Trend Connector Line -->
        <path d="M28 60 L44 45 L60 50 L76 30" 
              stroke="#0f172a" 
              stroke-width="2.6666666666666665" />
    </g>
</svg>
