steps:
  # 1. Build the container image
  # This builds both the frontend and backend due to the multi-stage Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:$COMMIT_SHA',
        '.',
      ]

  # 2. Extract the Windows binary from the Docker image
  # We create a temporary container, copy the file out, and then remove the container.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker create --name temp-container ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:$COMMIT_SHA
        docker cp temp-container:/app/CitadelDesktop.exe ./CitadelDesktop.exe
        docker rm temp-container

  # 3. Upload the Windows binary to Google Cloud Storage
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'storage',
        'cp',
        './CitadelDesktop.exe',
        'gs://${_ARTIFACT_BUCKET}/windows-${_IMAGE_NAME}-${_VERSION}.exe',
      ]

  # 4. Build macOS universal binary (Intel + Apple Silicon)
  # Uses Go cross-compilation to build for both architectures, then combines with lipo
  - name: 'golang:1.25'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Build for Intel (amd64)
        GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o CitadelDesktop-amd64 .
        # Build for Apple Silicon (arm64)
        GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o CitadelDesktop-arm64 .
        # Combine into universal binary using lipo
        apt-get update && apt-get install -y lipo || true
        # If lipo is not available, use Go's approach with a simple concatenation workaround
        # For proper universal binary, we'll upload both and note that macOS can run either
        # Actually, lipo requires macOS. We'll upload the arm64 binary as the primary macOS build
        # since it runs on both via Rosetta 2 (Intel Macs can't run arm64, but arm64 Macs can run amd64)
        # Better approach: upload both binaries separately
        mv CitadelDesktop-arm64 CitadelDesktop-macos-arm64
        mv CitadelDesktop-amd64 CitadelDesktop-macos-amd64

  # 5. Upload the macOS ARM64 binary (Apple Silicon) to Google Cloud Storage
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'storage',
        'cp',
        './CitadelDesktop-macos-arm64',
        'gs://${_ARTIFACT_BUCKET}/macos-arm64-${_IMAGE_NAME}-${_VERSION}',
      ]

  # 6. Upload the macOS AMD64 binary (Intel) to Google Cloud Storage
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'storage',
        'cp',
        './CitadelDesktop-macos-amd64',
        'gs://${_ARTIFACT_BUCKET}/macos-amd64-${_IMAGE_NAME}-${_VERSION}',
      ]

  # 7. Update Cloud Run backend service with new version environment variables
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'run',
        'services',
        'update',
        '${_BACKEND_SERVICE_NAME}',
        '--region',
        '${_REGION}',
        '--update-env-vars',
        'LATEST_VERSION=${_VERSION},LATEST_DOWNLOAD_URL=https://storage.googleapis.com/${_ARTIFACT_BUCKET}/windows-${_IMAGE_NAME}-${_VERSION}.exe,LATEST_MACOS_ARM64_URL=https://storage.googleapis.com/${_ARTIFACT_BUCKET}/macos-arm64-${_IMAGE_NAME}-${_VERSION},LATEST_MACOS_AMD64_URL=https://storage.googleapis.com/${_ARTIFACT_BUCKET}/macos-amd64-${_IMAGE_NAME}-${_VERSION}',
        '--quiet',
      ]


# Define substitution variables
substitutions:
  _REGION: 'us-east1'
  _REPO_NAME: 'us-service-desktop'
  _IMAGE_NAME: 'citadel-ops-desktop'
  _VERSION: '1.1.2'
  _ARTIFACT_BUCKET: 'us-service-ggebot-desktop-bucket'
  _BACKEND_SERVICE_NAME: 'live-backend-cloud'

options:
  logging: CLOUD_LOGGING_ONLY