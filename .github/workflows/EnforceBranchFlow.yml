name: Enforce branch flow

on:
  pull_request_review:
    types:
      - submitted
      - dismissed
      - edited

permissions:
  contents: read

jobs:
  require-develop-into-main:
    name: Require develop into main
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      (
        github.event.pull_request.head.ref != 'develop' ||
        github.event.pull_request.head.repo.full_name != github.repository
      )
    runs-on: ubuntu-latest
    steps:
      - name: Reject invalid source branch
        run: |
          echo "::error::Pull requests into main must come from this repository's develop branch."
          exit 1
